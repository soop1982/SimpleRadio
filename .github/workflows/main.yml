name: Retro Radio – zbuduj APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Budowanie
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk RetroAndroidRadio.apk

      - uses: actions/upload-artifact@v5
        with:
          name: RetroRadio-apk
          path: RetroAndroidRadio.apk
